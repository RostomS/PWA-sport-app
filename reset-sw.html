<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chronographe — Forcer la mise à jour</title>
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:#0E1013;color:#F3F5F8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
    text-align:center;padding:24px;}
  .box{max-width:360px}
  .ring{width:56px;height:56px;border-radius:50%;border:5px solid rgba(255,255,255,.15);border-top-color:#6D86FF;
    margin:0 auto 20px;animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  h1{font-size:20px;margin:0 0 8px;letter-spacing:-.02em}
  p{color:#9aa1ad;font-size:14px;line-height:1.5;margin:6px 0}
  b{color:#C6F135}
  .ok{color:#39C88C;font-weight:700}
  a{color:#6D86FF}
</style>
</head>
<body>
  <div class="box">
    <div class="ring" id="ring"></div>
    <h1 id="title">Mise à jour en cours…</h1>
    <p id="msg">Je vide l’ancien cache et je recharge la dernière version.</p>
    <p><b>Tes données sont conservées</b> — historique, mesures et programme restent intacts.</p>
    <p id="fallback" style="display:none"><a href="./index.html">Ouvrir l’application</a></p>
  </div>
<script>
(async function(){
  const title=document.getElementById('title'), msg=document.getElementById('msg'),
        ring=document.getElementById('ring'), fb=document.getElementById('fallback');
  try{
    // 1) Désinscrire tous les service workers de ce site
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
    // 2) Supprimer tous les caches (PAS IndexedDB → les données restent)
    if(window.caches){
      const keys=await caches.keys();
      await Promise.all(keys.map(k=>caches.delete(k)));
    }
    title.textContent='À jour ✓';
    title.className='ok';
    msg.textContent='Cache vidé. Redémarrage de l’application…';
    ring.style.display='none';
    // 3) Recharger l’app depuis le réseau (plus aucun service worker n’intercepte)
    setTimeout(()=>{ location.replace('./index.html?fresh='+Date.now()); }, 900);
  }catch(e){
    title.textContent='Presque !';
    msg.textContent='Touche le lien ci-dessous pour ouvrir la dernière version.';
    ring.style.display='none';
    fb.style.display='block';
  }
})();
</script>
</body>
</html>
