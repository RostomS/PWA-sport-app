<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" id="theme-meta" content="#EFEBE4" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Chrono" />
  <meta name="description" content="Suivi de musculation PPL, 100% local et hors-ligne." />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <link rel="icon" href="icons/icon-192.png" />
  <script>
    /* Thème : auto (système) ou forcé depuis Réglages. Appliqué avant le CSS pour éviter un flash. */
    window.applyTheme = function () {
      var t = null; try { t = localStorage.getItem('chrono-theme'); } catch (e) {}
      var root = document.documentElement;
      if (t === 'light' || t === 'dark') root.setAttribute('data-theme', t); else root.removeAttribute('data-theme');
      var dark = t === 'dark' || (t !== 'light' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
      var m = document.getElementById('theme-meta'); if (m) m.setAttribute('content', dark ? '#0B0B0C' : '#EFEBE4');
    };
    window.applyTheme();
    try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', window.applyTheme); } catch (e) {}
  </script>
  <link rel="stylesheet" href="css/app.css" />
  <title>Chronographe — Musculation</title>
</head>
<body>
  <div class="boot" id="boot"><div><div class="ring"></div></div></div>
  <main id="app" aria-live="polite"></main>
  <nav class="tabbar" id="tabbar" hidden></nav>

  <script src="js/data.js"></script>
  <script src="js/illustrations.js"></script>
  <script src="js/store.js"></script>
  <script src="js/logic.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
